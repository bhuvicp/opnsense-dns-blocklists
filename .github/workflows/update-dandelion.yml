name: Update Dandelion DNSBL

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

concurrency:
  group: update-dandelion
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate domain-only list
        run: python3 scripts/update_dandelion.py

      - name: Commit updated list if changed
        run: |
          if git diff --quiet -- dandelion-domains.txt && git ls-files --error-unmatch dandelion-domains.txt >/dev/null 2>&1; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dandelion-domains.txt
          git diff --cached --quiet && exit 0
          git commit -m "Update Dandelion domains"
          git push
